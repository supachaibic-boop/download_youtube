services:
  vault:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      API_TOKEN: ${API_TOKEN:?Run start.ps1 or set API_TOKEN in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      DATA_DIR: /data
    volumes:
      - ./data:/data
    stop_grace_period: 30s
